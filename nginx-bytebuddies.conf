server {
    listen 80;
    server_name bytebuddies.technology www.bytebuddies.technology;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name bytebuddies.technology www.bytebuddies.technology;

    ssl_certificate /etc/letsencrypt/live/bytebuddies.technology/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bytebuddies.technology/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    root /home/ubuntu/bytebuddies;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Dev paths must 404 in production (SPA fallback was serving HTML as JS)
    location ^~ /src/ {
        return 404;
    }

    # Never cache HTML entry points (Cloudflare + browsers)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    location = /recover.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /go.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /bb-entry.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Firebase Auth handler on our own domain (school Chromebooks block
    # third-party cookies / popups to *.firebaseapp.com).
    location ^~ /__/ {
        proxy_pass https://connectr-5b7a4.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host connectr-5b7a4.firebaseapp.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Hashed bundles — cache 1 year (filename changes on every deploy)
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Serve hashed assets directly — never fall back to index.html for these
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location /draco/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /bb-offline.js {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /privacy { rewrite ^ /privacy.html last; }
    location = /terms { rewrite ^ /terms.html last; }

    # SPA: all other routes serve index.html — never cache (forces fresh JS bundle hash)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
