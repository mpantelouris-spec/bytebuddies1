name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 129.151.144.92 >> ~/.ssh/known_hosts

      - name: Ensure nginx and firewall (fix Cloudflare 523)
        run: |
          ssh ubuntu@129.151.144.92 "
            set -e
            RULES=/etc/iptables/rules.v4
            if ! grep -q 'dport 80 -j ACCEPT' \"\$RULES\" || ! grep -q 'dport 443' \"\$RULES\"; then
              sudo cp -a \"\$RULES\" \"\${RULES}.bak\"
              sudo sed -i '/dport 22 -j ACCEPT/a -A INPUT -p tcp -m state --state NEW -m tcp --dport 80 -j ACCEPT\\n-A INPUT -p tcp -m state --state NEW -m tcp --dport 443 -j ACCEPT' \"\$RULES\"
              sudo iptables-restore < \"\$RULES\"
            fi
            sudo systemctl enable nginx
            sudo systemctl start nginx
            sudo nginx -t
            sudo systemctl restart nginx
            systemctl is-active nginx
            curl -sf -o /dev/null http://127.0.0.1/ && echo 'Origin HTTP OK' || echo 'WARN: index missing but nginx up'
          "

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Virtual Robot Designer tests
        run: npm run test:vrd

      - name: Build
        env:
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
        run: npm run build

      - name: Deploy to VPS
        run: |
          # Preserve characters on VPS (3 GB — only sync new/missing files)
          ssh ubuntu@129.151.144.92 "
            mkdir -p /home/ubuntu/bytebuddies/assets
            if [ -d /home/ubuntu/bytebuddies/assets/characters ]; then
              mv /home/ubuntu/bytebuddies/assets/characters /tmp/bb-characters-bak
            fi
            rm -rf /home/ubuntu/bytebuddies/*
            mkdir -p /home/ubuntu/bytebuddies/assets
            if [ -d /tmp/bb-characters-bak ]; then
              mv /tmp/bb-characters-bak /home/ubuntu/bytebuddies/assets/characters
            fi
          "
          # Sync app files (fast — excludes characters)
          rsync -az --delete --exclude='assets/characters/' dist/ ubuntu@129.151.144.92:/home/ubuntu/bytebuddies/
          # Sync characters — upload when file changed (size/mtime); replaces broken/stale sprites
          rsync -az --checksum dist/assets/characters/ ubuntu@129.151.144.92:/home/ubuntu/bytebuddies/assets/characters/
          ssh ubuntu@129.151.144.92 "find /home/ubuntu/bytebuddies -type d -exec chmod 755 {} \; && find /home/ubuntu/bytebuddies -type f -exec chmod 644 {} \; && sudo nginx -t && sudo systemctl restart nginx && curl -sf -o /dev/null http://127.0.0.1/ && echo 'Site OK on origin'"
