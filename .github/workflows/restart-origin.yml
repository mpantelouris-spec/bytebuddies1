# Emergency: restart nginx on VPS when Cloudflare shows Error 523
name: Restart origin (nginx)

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 129.151.144.92 >> ~/.ssh/known_hosts

      - name: Restart nginx and verify
        run: |
          ssh ubuntu@129.151.144.92 "
            set -e
            sudo systemctl enable nginx
            sudo systemctl start nginx
            sudo nginx -t
            sudo systemctl restart nginx
            systemctl is-active nginx
            test -f /home/ubuntu/bytebuddies/index.html
            curl -sf -o /dev/null http://127.0.0.1/
            echo 'Origin healthy'
          "
