<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>CodeRacer — 10 Cup Tracks</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #94a3b8; margin: 0 0 20px; max-width: 520px; line-height: 1.5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      max-width: 960px;
    }
    a.card {
      display: block;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(99, 102, 241, 0.4);
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    a.card:hover {
      background: rgba(99, 102, 241, 0.35);
      transform: translateY(-2px);
    }
    .emoji { font-size: 28px; margin-bottom: 8px; }
    .name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .tier { font-size: 12px; color: #a5b4fc; }
    .home { margin-top: 24px; color: #818cf8; }
  </style>
</head>
<body>
  <h1>🏎️ CodeRacer — 10 Cup Tracks</h1>
  <p>Pick a track below. Each has a <strong>different shape</strong>, colours, and themed world (buildings, trees, animals). After loading, look for the <strong>Cup tracks</strong> bar at the bottom of the 3D view (v32+).</p>
  <div class="grid" id="tracks"></div>
  <p class="home"><a href="/go.html">Clear cache &amp; reload</a> · <a href="/#studio">Studio home</a></p>
  <script>
    var TRACKS = [
      { id: 'sunset_cove_01', emoji: '🏖️', name: 'Sunset Cove Speedway', tier: 'Beginner ★' },
      { id: 'candy_carnival_01', emoji: '🎡', name: 'Candy Carnival Circuit', tier: 'Beginner ★' },
      { id: 'neon_metro_01', emoji: '🚇', name: 'Neon Metro Rush', tier: 'Easy ★★' },
      { id: 'cloud_citadel_01', emoji: '🏰', name: 'Cloud Citadel Loop', tier: 'Easy ★★' },
      { id: 'jungle_ruins_01', emoji: '🗿', name: 'Jungle Ruins Rally', tier: 'Intermediate ★★★' },
      { id: 'frost_peak_01', emoji: '🏔️', name: 'Frost Peak Descent', tier: 'Intermediate ★★★' },
      { id: 'lava_foundry_01', emoji: '🔥', name: 'Lava Foundry Forge', tier: 'Intermediate ★★★' },
      { id: 'star_station_01', emoji: '🛸', name: 'Star Station Ring', tier: 'Hard ★★★★' },
      { id: 'fairy_glen_01', emoji: '🧚', name: 'Fairy Glen Gardens', tier: 'Hard ★★★★' },
      { id: 'thunder_ridge_01', emoji: '⛈️', name: 'Thunder Ridge Challenge', tier: 'Hard ★★★★' },
    ];
    var grid = document.getElementById('tracks');
    TRACKS.forEach(function (t) {
      var a = document.createElement('a');
      a.className = 'card';
      a.href = '/#studio?track=' + t.id + '&_cup=' + Date.now();
      a.innerHTML = '<div class="emoji">' + t.emoji + '</div><div class="name">' + t.name + '</div><div class="tier">' + t.tier + '</div>';
      grid.appendChild(a);
    });
  </script>
</body>
</html>
